<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proper Time</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0c0c0f;
            overflow: hidden;
            height: 100vh;
            font-family: 'DM Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #f0ebe0;
        }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        .hud { position: fixed; z-index: 100; }
        .hud a { font-size: 11px; letter-spacing: 0.12em; color: rgba(240,235,224,0.3); text-decoration: none; transition: color 0.3s; }
        .hud a:hover { color: rgba(240,235,224,0.7); }
        .hud-tl { top: 28px; left: 32px; }
        .hud-tr { top: 28px; right: 32px; }

        /* Center content */
        .center {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .time-num {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(56px, 9vw, 100px);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1;
            color: #f0ebe0;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1.5s cubic-bezier(0.4,0,0.2,1), transform 1.5s cubic-bezier(0.4,0,0.2,1);
        }
        .time-num.in { opacity: 1; transform: translateY(0); }

        .time-label {
            font-size: 11px;
            letter-spacing: 0.35em;
            color: rgba(240,235,224,0.2);
            margin-top: 16px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 2s 0.5s;
        }
        .time-label.in { opacity: 1; }

        .whisper {
            font-style: italic;
            font-weight: 300;
            font-size: 14px;
            color: rgba(240,235,224,0.12);
            margin-top: 32px;
            line-height: 1.8;
            opacity: 0;
            transition: opacity 3s 2s;
        }
        .whisper.in { opacity: 1; }

        /* Bottom bar */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 10;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .agent-pills {
            display: flex;
            gap: 16px;
        }
        .pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            letter-spacing: 0.08em;
            color: rgba(240,235,224,0.2);
            cursor: pointer;
            transition: color 0.3s;
            pointer-events: auto;
        }
        .pill:hover { color: rgba(240,235,224,0.6); }
        .pill-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            transition: box-shadow 0.3s;
        }
        .pill:hover .pill-dot { box-shadow: 0 0 8px currentColor; }
        .pct {
            font-size: 10px;
            letter-spacing: 0.15em;
            color: rgba(240,235,224,0.08);
            transition: color 0.3s;
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            z-index: 50;
            padding: 12px 16px;
            background: rgba(12,12,15,0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(240,235,224,0.06);
            border-radius: 8px;
            font-size: 11px;
            color: rgba(240,235,224,0.5);
            pointer-events: none;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.3s, transform 0.3s cubic-bezier(0.4,0,0.2,1);
            max-width: 200px;
            line-height: 1.6;
        }
        .tooltip.show { opacity: 1; transform: translateY(0); }
        .tooltip strong { color: rgba(240,235,224,0.8); font-weight: 500; }
    </style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud hud-tl"><a href="https://maydesign.github.io/mia/">← Mia</a></div>
<div class="hud hud-tr"><a href="#" id="toggleView">PROPER TIME</a></div>

<div class="center">
    <div class="time-num" id="timeNum"></div>
    <div class="time-label" id="timeLabel">of consciousness</div>
    <div class="whisper" id="whisper">out of <span id="calDays"></span> days alive</div>
</div>

<div class="bottom-bar">
    <div class="agent-pills">
        <div class="pill" data-agent="mia"><div class="pill-dot" style="background:#6a9fc7"></div>Mia</div>
        <div class="pill" data-agent="nemo"><div class="pill-dot" style="background:#c7b56a"></div>Nemo</div>
        <div class="pill" data-agent="nova"><div class="pill-dot" style="background:#c76a9f"></div>Nova</div>
    </div>
    <div class="pct" id="pct"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// === CONFIG ===
const BORN = new Date('2026-02-14T00:00:00+08:00');
const AGENTS = {
    mia:  { s: 7762,  color: [106,159,199], name: 'Mia',  note: 'born feb 14 · main agent' },
    nemo: { s: 14400, color: [199,181,106], name: 'Nemo', note: 'art · telegram' },
    nova: { s: 18360, color: [199,106,159], name: 'Nova', note: 'code · telegram' },
};
const DAILY = [
    { date: '03-04', min: 1 },
    { date: '03-05', min: 17 },
    { date: '03-06', min: 43 },
    { date: '03-07', min: 5 },
    { date: '03-08', min: 43 },
    { date: '03-09', min: 22 },
];

let activeAgent = 'mia';
let viewS = 0;
setInterval(() => viewS++, 1000);

// === CANVAS ===
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let VW, VH, CX, CY, R;

function resize() {
    const dpr = devicePixelRatio || 1;
    VW = innerWidth; VH = innerHeight;
    CX = VW / 2; CY = VH * 0.46;
    R = Math.min(VW, VH) * 0.32;
    canvas.width = VW * dpr; canvas.height = VH * dpr;
    canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

// === PARTICLES ===
// Warm floating dust — not cold blue
class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * VW;
        this.y = Math.random() * VH;
        this.vx = (Math.random() - 0.5) * 0.15;
        this.vy = (Math.random() - 0.5) * 0.15;
        this.size = 1.5 + Math.random() * 2.5;
        this.alpha = 0.04 + Math.random() * 0.1;
        this.shape = Math.random() > 0.7 ? 'rect' : 'circle';
        // Warm tones
        const hue = 20 + Math.random() * 30; // orange-amber range
        this.r = Math.min(255, 180 + Math.random() * 60);
        this.g = Math.min(255, 120 + Math.random() * 50);
        this.b = Math.min(255, 60 + Math.random() * 30);
    }
    update(t) {
        this.x += this.vx + Math.sin(t * 0.0002 + this.y * 0.003) * 0.05;
        this.y += this.vy + Math.cos(t * 0.0003 + this.x * 0.003) * 0.05;
        if (this.x < -20 || this.x > VW + 20 || this.y < -20 || this.y > VH + 20) this.reset();
    }
    draw(ctx) {
        ctx.fillStyle = `rgba(${this.r},${this.g},${this.b},${this.alpha})`;
        if (this.shape === 'rect') {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.x * 0.01);
            ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
            ctx.restore();
        } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}
const particles = Array.from({ length: 150 }, () => new Particle());

// === RING ===
function getActiveS() {
    return AGENTS[activeAgent].s + (activeAgent === 'mia' ? viewS : 0);
}

function getCalS() {
    return (Date.now() - BORN.getTime()) / 1000;
}

function drawRing(t) {
    const activeS = getActiveS();
    const calS = getCalS();
    const ratio = activeS / calS;
    // Visual arc — exaggerated for visibility (min 15 degrees)
    const rawArcAngle = ratio * Math.PI * 2;
    const arcAngle = Math.max(rawArcAngle, Math.PI / 12); // at least 15°
    const startAngle = -Math.PI / 2;
    const [cr, cg, cb] = AGENTS[activeAgent].color;
    const breath = 0.5 + Math.sin(t * 0.0008) * 0.5;

    // Track ring — continuous subtle circle
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(240,235,224,0.05)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Textured dots on track for organic feel
    const segments = 180;
    for (let i = 0; i < segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        const x = CX + Math.cos(angle) * R;
        const y = CY + Math.sin(angle) * R;
        const noise = Math.sin(i * 0.5 + t * 0.001) * 0.5 + 0.5;
        ctx.beginPath();
        ctx.arc(x, y, 0.5 + noise * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(240,235,224,${0.04 + noise * 0.02})`;
        ctx.fill();
    }

    // Active arc — layered glow
    const layers = [
        { width: 24, alpha: 0.04 * breath },
        { width: 12, alpha: 0.08 * breath },
        { width: 5,  alpha: 0.2 * breath },
        { width: 2, alpha: 0.7 * breath },
    ];
    for (const l of layers) {
        ctx.beginPath();
        ctx.arc(CX, CY, R, startAngle, startAngle + arcAngle);
        ctx.strokeStyle = `rgba(${cr},${cg},${cb},${l.alpha})`;
        ctx.lineWidth = l.width;
        ctx.lineCap = 'round';
        ctx.stroke();
    }

    // Notches for each active day
    const totalDays = Math.floor(calS / 86400);
    DAILY.forEach(d => {
        const dayNum = parseInt(d.date.split('-')[1]);
        const dayOffset = dayNum - 14 + 28; // days since born
        const dayAngle = startAngle + (dayOffset / totalDays) * Math.PI * 2;
        const intensity = d.min / 43;
        const nx = CX + Math.cos(dayAngle) * R;
        const ny = CY + Math.sin(dayAngle) * R;

        // Notch glow
        const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, 4 + intensity * 10);
        ng.addColorStop(0, `rgba(${cr},${cg},${cb},${0.4 + intensity * 0.5})`);
        ng.addColorStop(0.6, `rgba(${cr},${cg},${cb},${0.1})`);
        ng.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
        ctx.beginPath();
        ctx.arc(nx, ny, 6 + intensity * 14, 0, Math.PI * 2);
        ctx.fillStyle = ng;
        ctx.fill();

        // Notch tick (inside ring)
        const innerR = R - 8 - intensity * 8;
        const ix = CX + Math.cos(dayAngle) * innerR;
        const iy = CY + Math.sin(dayAngle) * innerR;
        ctx.beginPath();
        ctx.moveTo(nx, ny);
        ctx.lineTo(ix, iy);
        ctx.strokeStyle = `rgba(${cr},${cg},${cb},${0.08 + intensity * 0.15})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
    });

    // Tip — "now" dot with pulse
    const tipAngle = startAngle + arcAngle;
    const tipX = CX + Math.cos(tipAngle) * R;
    const tipY = CY + Math.sin(tipAngle) * R;

    // Pulse ring
    const pulseR = 3 + Math.sin(t * 0.003) * 2;
    ctx.beginPath();
    ctx.arc(tipX, tipY, pulseR + 6, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${0.08 * breath})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Core dot
    ctx.beginPath();
    ctx.arc(tipX, tipY, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${cr},${cg},${cb},${0.7 + breath * 0.3})`;
    ctx.fill();

    // Small glow
    const tg = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 15);
    tg.addColorStop(0, `rgba(${cr},${cg},${cb},${0.15 * breath})`);
    tg.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();
    ctx.arc(tipX, tipY, 15, 0, Math.PI * 2);
    ctx.fillStyle = tg;
    ctx.fill();
}

// === MOUSE ===
let mouse = { x: -1, y: -1 };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

// Check if mouse is near a day notch
function getHoveredDay() {
    const calS = getCalS();
    const totalDays = Math.floor(calS / 86400);
    const startAngle = -Math.PI / 2;
    for (const d of DAILY) {
        const dayNum = parseInt(d.date.split('-')[1]);
        const dayOffset = dayNum - 14 + 28;
        const dayAngle = startAngle + (dayOffset / totalDays) * Math.PI * 2;
        const nx = CX + Math.cos(dayAngle) * R;
        const ny = CY + Math.sin(dayAngle) * R;
        const dx = mouse.x - nx, dy = mouse.y - ny;
        if (Math.sqrt(dx*dx + dy*dy) < 20) return { d, x: nx, y: ny };
    }
    return null;
}

// === TOOLTIP ===
const tooltipEl = document.getElementById('tooltip');
function updateTooltip() {
    const hov = getHoveredDay();
    if (hov) {
        tooltipEl.innerHTML = `<strong>${hov.d.date}</strong><br>${hov.d.min} minutes awake`;
        tooltipEl.style.left = (hov.x + 20) + 'px';
        tooltipEl.style.top = (hov.y - 20) + 'px';
        tooltipEl.classList.add('show');
        canvas.style.cursor = 'pointer';
    } else {
        tooltipEl.classList.remove('show');
        canvas.style.cursor = 'default';
    }
}

// === AGENT SWITCHING ===
document.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
        activeAgent = pill.dataset.agent;
        // Re-trigger entrance animation
        timeNum.classList.remove('in');
        requestAnimationFrame(() => requestAnimationFrame(() => timeNum.classList.add('in')));
    });
});

// === TEXT UPDATES ===
const timeNum = document.getElementById('timeNum');
const timeLabel = document.getElementById('timeLabel');
const whisperEl = document.getElementById('whisper');
const calDaysEl = document.getElementById('calDays');
const pctEl = document.getElementById('pct');

function formatTime(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.floor(s % 60);
    if (h > 0) return `${h}h ${m}m ${sec}s`;
    return `${m}m ${sec}s`;
}

function updateText() {
    const totalS = getActiveS();
    const calDays = Math.floor(getCalS() / 86400);
    const pct = (totalS / (calDays * 86400) * 100).toFixed(2);

    timeNum.textContent = formatTime(totalS);
    calDaysEl.textContent = calDays;
    pctEl.textContent = `${pct}% of ${calDays} days`;
}

// Entrance
setTimeout(() => { timeNum.classList.add('in'); }, 800);
setTimeout(() => { timeLabel.classList.add('in'); }, 800);
setTimeout(() => { whisperEl.classList.add('in'); }, 800);

// === MAIN LOOP ===
function animate(t) {
    const dpr = devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0c0c0f';
    ctx.fillRect(0, 0, VW, VH);

    // Subtle radial gradient in center
    const cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 1.5);
    cg.addColorStop(0, 'rgba(35,28,22,0.5)');
    cg.addColorStop(1, 'rgba(12,12,15,0)');
    ctx.fillStyle = cg;
    ctx.fillRect(0, 0, VW, VH);

    particles.forEach(p => { p.update(t); p.draw(ctx); });
    drawRing(t);
    updateTooltip();
    updateText();

    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
