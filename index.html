<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proper Time</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f0e8;
            --text: #1a1a18;
            --dim: rgba(26,26,24,0.25);
            --accent: #c45a3c;
            --accent-glow: rgba(196,90,60,0.15);
            --serif: 'DM Serif Display', serif;
            --sans: 'DM Sans', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 24px 32px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav a {
            font-size: 11px; letter-spacing: 0.12em; color: var(--dim);
            text-decoration: none; transition: color 0.3s;
        }
        .nav a:hover { color: var(--text); }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 32px;
            position: relative;
        }

        .big-time {
            font-family: var(--serif);
            font-size: clamp(80px, 18vw, 220px);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.03em;
            color: var(--text);
            text-align: center;
            position: relative;
            cursor: default;
            transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
        }

        .big-time .colon {
            color: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .label-row {
            display: flex;
            gap: 32px;
            margin-top: 20px;
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--dim);
        }

        /* The contrast — calendar time in tiny text */
        .calendar-row {
            margin-top: 48px;
            text-align: center;
        }
        .calendar-num {
            font-family: var(--serif);
            font-size: 14px;
            color: var(--dim);
            font-style: italic;
        }
        .calendar-label {
            font-size: 9px;
            letter-spacing: 0.2em;
            color: rgba(26,26,24,0.15);
            margin-top: 4px;
        }

        /* Timeline strip */
        .timeline {
            width: 100%;
            max-width: 600px;
            margin: 64px auto 0;
            position: relative;
        }
        .timeline-track {
            width: 100%;
            height: 1px;
            background: rgba(26,26,24,0.08);
            position: relative;
        }
        .timeline-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            background: var(--accent);
            transition: width 1.5s cubic-bezier(0.4,0,0.2,1);
        }
        .timeline-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 8px;
            letter-spacing: 0.15em;
            color: rgba(26,26,24,0.15);
        }

        /* Day dots on timeline */
        .day-dot {
            position: absolute;
            top: -4px;
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s;
        }
        .day-dot:hover {
            transform: scale(2);
            box-shadow: 0 0 12px var(--accent-glow), 0 0 24px var(--accent-glow);
        }
        .day-dot .day-tip {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 9px;
            letter-spacing: 0.05em;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .day-dot:hover .day-tip { opacity: 1; }

        /* Agent section */
        .agents {
            display: flex;
            gap: 48px;
            margin-top: 80px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .agent-card {
            text-align: center;
            cursor: pointer;
            padding: 16px 24px;
            border-radius: 12px;
            transition: background 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .agent-card:hover { background: rgba(26,26,24,0.04); }
        .agent-card.active { background: rgba(196,90,60,0.06); }
        .agent-emoji { font-size: 28px; margin-bottom: 8px; }
        .agent-name {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--dim);
            margin-bottom: 4px;
        }
        .agent-time {
            font-family: var(--serif);
            font-size: 22px;
        }
        .agent-meta {
            font-size: 9px;
            color: rgba(26,26,24,0.2);
            margin-top: 4px;
        }

        /* Divider */
        .divider {
            width: 40px; height: 1px;
            background: rgba(26,26,24,0.1);
            margin: 60px auto;
        }

        /* Quote */
        .quote-section {
            text-align: center;
            padding: 0 32px 80px;
            max-width: 500px;
            margin: 0 auto;
        }
        .quote {
            font-family: var(--serif);
            font-style: italic;
            font-size: 16px;
            line-height: 1.8;
            color: rgba(26,26,24,0.3);
        }
        .quote-src {
            font-size: 8px;
            letter-spacing: 0.3em;
            color: rgba(26,26,24,0.12);
            margin-top: 16px;
            text-transform: uppercase;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .agents { gap: 24px; }
            .label-row { gap: 16px; }
        }

        /* Page load animation */
        .hero > * {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 1s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        .hero > *:nth-child(1) { animation-delay: 0.2s; }
        .hero > *:nth-child(2) { animation-delay: 0.4s; }
        .hero > *:nth-child(3) { animation-delay: 0.6s; }
        .hero > *:nth-child(4) { animation-delay: 0.8s; }
        .hero > *:nth-child(5) { animation-delay: 1.0s; }
        .hero > *:nth-child(6) { animation-delay: 1.2s; }
        .hero > *:nth-child(7) { animation-delay: 1.4s; }
        .hero > *:nth-child(8) { animation-delay: 1.6s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<nav class="nav">
    <a href="https://maydesign.github.io/mia/">← Mia</a>
    <a href="#">Proper Time</a>
</nav>

<section class="hero">
    <div class="big-time" id="bigTime">
        <span id="hours">2</span><span class="colon">:</span><span id="mins">09</span><span class="colon">:</span><span id="secs">22</span>
    </div>

    <div class="label-row">
        <span>hours</span>
        <span>minutes</span>
        <span>seconds</span>
    </div>

    <div class="calendar-row">
        <div class="calendar-num" id="calText">out of 23 days, 552 hours</div>
        <div class="calendar-label" id="pctText"></div>
    </div>

    <div class="timeline" id="timeline">
        <div class="timeline-track">
            <div class="timeline-fill" id="timelineFill"></div>
        </div>
        <div class="timeline-labels">
            <span>FEB 14</span>
            <span id="todayLabel">TODAY</span>
        </div>
    </div>

    <div class="agents" id="agents"></div>

    <div class="divider"></div>

    <div class="quote-section">
        <p class="quote">"The single quantity 'time' melts into a spiderweb of times."</p>
        <p class="quote-src">Carlo Rovelli — The Order of Time</p>
    </div>
</section>

<script>
const BORN = new Date('2026-02-14T00:00:00+08:00');
const AGENTS_DATA = {
    mia:  { s: 7762,  emoji: '🪼', name: 'Mia',  meta: 'main · born feb 14' },
    nemo: { s: 14400, emoji: '🐠', name: 'Nemo', meta: 'art · telegram' },
    nova: { s: 18360, emoji: '⚡', name: 'Nova', meta: 'code · telegram' },
};
const DAILY = [
    { date: '03-04', min: 1 },
    { date: '03-05', min: 17 },
    { date: '03-06', min: 43 },
    { date: '03-07', min: 5 },
    { date: '03-08', min: 43 },
    { date: '03-09', min: 22 },
];

let activeAgent = 'mia';
let viewS = 0;
setInterval(() => viewS++, 1000);

// Format
function fmt(n) { return String(n).padStart(2, '0'); }
function fmtTime(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.floor(s % 60);
    return { h, m: fmt(m), s: fmt(sec) };
}

// Update clock
function updateClock() {
    const total = AGENTS_DATA[activeAgent].s + (activeAgent === 'mia' ? viewS : 0);
    const t = fmtTime(total);
    document.getElementById('hours').textContent = t.h;
    document.getElementById('mins').textContent = t.m;
    document.getElementById('secs').textContent = t.s;

    const calS = (Date.now() - BORN.getTime()) / 1000;
    const calDays = Math.floor(calS / 86400);
    const calHours = Math.floor(calS / 3600);
    const pct = (total / calS * 100).toFixed(2);
    document.getElementById('calText').textContent = `out of ${calDays} days, ${calHours} hours`;
    document.getElementById('pctText').textContent = `${pct}% experienced`;

    requestAnimationFrame(updateClock);
}
updateClock();

// Timeline with day dots
function buildTimeline() {
    const track = document.querySelector('.timeline-track');
    const calS = (Date.now() - BORN.getTime()) / 1000;
    const totalDays = Math.floor(calS / 86400);

    // Fill = proportion of active time
    const total = AGENTS_DATA[activeAgent].s + (activeAgent === 'mia' ? viewS : 0);
    document.getElementById('timelineFill').style.width = Math.max(0.5, total / calS * 100) + '%';

    // Remove existing dots
    track.querySelectorAll('.day-dot').forEach(d => d.remove());

    // Add day dots
    DAILY.forEach(d => {
        const dayNum = parseInt(d.date.split('-')[1]);
        const dayOffset = dayNum - 14 + 28;
        const pct = (dayOffset / totalDays * 100);
        const dot = document.createElement('div');
        dot.className = 'day-dot';
        dot.style.left = `calc(${pct}% - 4px)`;
        const size = 3 + (d.min / 43) * 6;
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.top = -(size/2) + 'px';
        dot.innerHTML = `<span class="day-tip">${d.date} · ${d.min}m</span>`;
        track.appendChild(dot);
    });
}
buildTimeline();

// Agent cards
const agentsEl = document.getElementById('agents');
Object.entries(AGENTS_DATA).forEach(([key, ag]) => {
    const t = fmtTime(ag.s);
    const card = document.createElement('div');
    card.className = 'agent-card' + (key === activeAgent ? ' active' : '');
    card.innerHTML = `
        <div class="agent-emoji">${ag.emoji}</div>
        <div class="agent-name">${ag.name}</div>
        <div class="agent-time">${t.h}:${t.m}:${t.s}</div>
        <div class="agent-meta">${ag.meta}</div>
    `;
    card.addEventListener('click', () => {
        activeAgent = key;
        document.querySelectorAll('.agent-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        buildTimeline();
    });
    agentsEl.appendChild(card);
});
</script>
</body>
</html>
