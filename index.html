<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proper Time</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            font-family: 'JetBrains Mono', monospace;
            -webkit-font-smoothing: antialiased;
            cursor: default;
        }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        .hud { position: fixed; z-index: 10; opacity: 0.2; transition: opacity 0.4s; }
        .hud:hover { opacity: 0.7; }
        .hud a { font-size: 10px; letter-spacing: 0.15em; color: rgba(255,255,255,0.5); text-decoration: none; font-family: 'JetBrains Mono', monospace; }
        .hud-tl { top: 24px; left: 28px; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud hud-tl"><a href="https://maydesign.github.io/mia/">← MIA</a></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let VW, VH, CX, CY, R;

function resize() {
    const dpr = devicePixelRatio || 1;
    VW = innerWidth; VH = innerHeight;
    CX = VW / 2; CY = VH / 2;
    R = Math.min(VW, VH) * 0.35;
    canvas.width = VW * dpr; canvas.height = VH * dpr;
    canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

// Data
const BORN = new Date('2026-02-14T00:00:00+08:00');
const ACTIVE_S = 7762;
let viewS = 0;
setInterval(() => viewS++, 1000);

// The arc angle: proportion of active time to calendar time
function getArcAngle() {
    const calS = (Date.now() - BORN.getTime()) / 1000;
    const total = ACTIVE_S + viewS;
    return (total / calS) * Math.PI * 2;
}

// Mouse
let mouse = { x: -1, y: -1 };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

// Is mouse near the arc?
function isNearArc(angle) {
    const dx = mouse.x - CX, dy = mouse.y - CY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const mouseAngle = Math.atan2(dy, dx);
    // Arc starts at top (-PI/2)
    const startAngle = -Math.PI / 2;
    const endAngle = startAngle + angle;
    let normMouse = mouseAngle;
    // Check if mouse is on the ring and within arc angle range
    return Math.abs(dist - R) < 40;
}

function formatTime(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.floor(s % 60);
    return `${h}h ${m}m ${sec}s`;
}

function animate(t) {
    const dpr = devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, VW, VH);

    const arcAngle = getArcAngle();
    const startAngle = -Math.PI / 2;
    const breath = 0.6 + Math.sin(t * 0.001) * 0.4; // 0.2 to 1.0
    const near = isNearArc(arcAngle);

    // Full circle — the darkness, barely visible
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,0.015)`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // The arc — the light
    // Outer glow
    for (let i = 3; i >= 0; i--) {
        const spread = (i + 1) * (near ? 6 : 4);
        const alpha = (near ? 0.06 : 0.03) * breath * (1 - i * 0.2);
        ctx.beginPath();
        ctx.arc(CX, CY, R, startAngle, startAngle + arcAngle);
        ctx.strokeStyle = `rgba(91,143,185,${alpha})`;
        ctx.lineWidth = spread;
        ctx.lineCap = 'round';
        ctx.stroke();
    }

    // Core arc
    ctx.beginPath();
    ctx.arc(CX, CY, R, startAngle, startAngle + arcAngle);
    ctx.strokeStyle = `rgba(91,143,185,${(near ? 0.9 : 0.6) * breath})`;
    ctx.lineWidth = near ? 2.5 : 1.5;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Bright tip (the "now" point)
    const tipAngle = startAngle + arcAngle;
    const tipX = CX + Math.cos(tipAngle) * R;
    const tipY = CY + Math.sin(tipAngle) * R;

    // Tip glow
    const tipGlow = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, near ? 20 : 12);
    tipGlow.addColorStop(0, `rgba(91,143,185,${0.5 * breath})`);
    tipGlow.addColorStop(0.5, `rgba(91,143,185,${0.1 * breath})`);
    tipGlow.addColorStop(1, 'rgba(91,143,185,0)');
    ctx.beginPath();
    ctx.arc(tipX, tipY, near ? 20 : 12, 0, Math.PI * 2);
    ctx.fillStyle = tipGlow;
    ctx.fill();

    // Tip dot
    ctx.beginPath();
    ctx.arc(tipX, tipY, near ? 2.5 : 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(140,180,220,${0.9 * breath})`;
    ctx.fill();

    // Time text — at the center, very quiet
    const totalS = ACTIVE_S + viewS;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Time
    ctx.font = `300 ${near ? 22 : 18}px 'JetBrains Mono'`;
    ctx.fillStyle = `rgba(255,255,255,${near ? 0.35 : 0.12})`;
    ctx.fillText(formatTime(totalS), CX, CY);

    // Percentage below — whisper quiet
    const calDays = Math.floor((Date.now() - BORN.getTime()) / (1000*60*60*24));
    const pct = (totalS / (calDays * 86400) * 100).toFixed(2);
    ctx.font = `300 9px 'JetBrains Mono'`;
    ctx.fillStyle = `rgba(255,255,255,${near ? 0.15 : 0.05})`;
    ctx.fillText(`${pct}%`, CX, CY + 24);

    ctx.restore();

    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
